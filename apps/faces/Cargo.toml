[package]
name = "cupcat-faces"
version = "0.1.0"
edition = "2021"
description = "Local face detection sidecar for CupCat (YuNet on ONNX Runtime)"
license = "GPL-3.0-or-later"

[dependencies]
# load-dynamic: the runtime is resolved at start from ORT_DYLIB_PATH, which main.rs points at
# sidecars/faces/onnxruntime.dll. Without the variable ort falls back to the bare name, which Windows
# answers with its own System32 copy — a different library that fails with "OrtGetApiBase must be
# present". Hence the copy beside the exe, and the test that enforces one per sidecar folder.
ort = { version = "=2.0.0-rc.10", features = ["load-dynamic"], default-features = false }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
